<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vélox — boutique fictive de crampons de football en React : catalogue, fiche produit, panier, mode clair et sombre. Projet étudiant d'Emile Dufoulon." />
    <meta name="theme-color" content="#0B0B0C" />
    <title>Vélox — Crampons de football</title>
    <script>
      // Applique le thème avant l'affichage pour éviter un flash
      (function () {
        var t = null
        try { t = localStorage.getItem('velox-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
